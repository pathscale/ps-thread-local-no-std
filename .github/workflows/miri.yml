# Manual. Miri under a pthread-keyed thread local is slow and this crate does
# not change often; running it on every push would buy nothing.
name: Miri

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  miri:
    name: Miri (strict provenance)
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test
