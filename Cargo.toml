[package]
name = "ps-thread-local-no-std"
version = "0.1.0"
authors = ["Mike Hommey <mh@glandium.org>"]
license = "Apache-2.0 OR MIT"
edition = "2018"
rust-version = "1.81"
description = """OS-backed thread-local storage, without std.

A fork of os-thread-local 0.1.3 with no_std support: `core::error::Error` and
`alloc::boxed::Box` in place of their std spellings, and nothing else. Provides
a `ThreadLocal` type as an alternative to `std::thread_local!` that allows
per-object thread-local storage with a similar API, always using the
thread-local storage primitives provided by the OS.
"""
repository = "https://github.com/pathscale/ps-thread-local-no-std"
readme = "README.md"
keywords = ["os", "thread-local", "no-std", "tls"]
categories = ["no-std", "concurrency"]

[target.'cfg(not(windows))'.dependencies.libc]
version = "0.2"
default-features = false

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = ["fibersapi"]

[dev-dependencies]
crossbeam-utils = "0.6"
once_cell = "1"
