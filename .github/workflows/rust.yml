name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Run tests
        run: cargo test --all-targets --verbose
      - name: Run doctests
        run: cargo test --doc --verbose
      # `no_std` here means the crate does not link Rust's standard library. It
      # does not mean bare metal: every access is a `pthread_*` call, so an
      # operating system is a hard requirement, and a target like
      # `x86_64-unknown-none` can never build this because `libc` has no
      # pthreads there. An earlier version of this file asked for exactly that
      # and was red from the first push.
      #
      # musl is the check worth running instead. It is the libc where the key
      # budget is tightest, 128 against glibc's 1024, and it is where a `no_std`
      # consumer is most likely to end up.
      - name: Build against musl
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --lib --target x86_64-unknown-linux-musl --verbose

  lint:
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, lint]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping publish"; exit 0; fi
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if curl -fsSL "https://index.crates.io/ps/-t/ps-thread-local-no-std" | sed -n 's/.*"vers":"\([^"]*\)".*/\1/p' | grep -qx "$v"; then
            echo "ps-thread-local-no-std $v is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish
