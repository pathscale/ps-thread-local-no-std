name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Run tests
        run: cargo test --all-targets --verbose
      - name: Run doctests
        run: cargo test --doc --verbose
      # The whole point of the fork. `cargo build` above links std for the dev
      # dependencies; this asks the compiler whether the library itself still
      # needs it, on a target that has no std to fall back on.
      - name: Build for a no_std target
        run: |
          rustup target add x86_64-unknown-none
          cargo build --lib --target x86_64-unknown-none --verbose

  lint:
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, lint]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping publish"; exit 0; fi
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if curl -fsSL "https://index.crates.io/ps/-t/ps-thread-local-no-std" | sed -n 's/.*"vers":"\([^"]*\)".*/\1/p' | grep -qx "$v"; then
            echo "ps-thread-local-no-std $v is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish
